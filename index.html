<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h2>

      <div class="balance-container">
        <h2>Your Balance</h2>
        <h1 id="balance">$0.00</h1>

        <div class="summary">
          <div class="income">
            <h3>Income</h3>
            <p id="income-amount">$0.00</p>
          </div>
          <div class="expenses">
            <h3>Expenses</h3>
            <p id="expense-amount">$0.00</p>
          </div>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="expense-chart"></canvas>
      </div>

      <div class="main-content">
        <div class="transaction-container">
          <div class="transaction-header">
            <h2>Transactions</h2>
            <div class="filter-container">
              <input type="text" id="search" placeholder="Search transactions..." />
              <select id="filter">
                <option value="all">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
          </div>
          <ul id="transaction-list">
            <!-- TRANSACTIONS WILL BE INSERTED HERE -->
          </ul>
        </div>

        <div class="form-container">
          <h2>Add Transaction</h2>

          <form id="transaction-form">
            <div class="form-group">
              <label for="description">Description</label>
              <input type="text" id="description" placeholder="Enter description..." required />
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" placeholder="Enter amount..." required />
              <small>Use negative (-) for expenses</small>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="" disabled selected>Select category</option>
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="salary">Salary</option>
                <option value="shopping">Shopping</option>
                <option value="utilities">Utilities</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="text" id="date" placeholder="Select date..." required />
            </div>

            <button type="submit">Add Transaction</button>
          </form>
          <button id="export-csv">Export to CSV</button>
        </div>
      </div>
    </div>

    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Edit Transaction</h2>
        <form id="edit-form">
          <input type="hidden" id="edit-id" />
          <div class="form-group">
            <label for="edit-description">Description</label>
            <input type="text" id="edit-description" required />
          </div>
          <div class="form-group">
            <label for="edit-amount">Amount</label>
            <input type="number" id="edit-amount" required />
          </div>
          <div class="form-group">
            <label for="edit-category">Category</label>
            <select id="edit-category" required>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="salary">Salary</option>
              <option value="shopping">Shopping</option>
              <option value="utilities">Utilities</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-date">Date</label>
            <input type="text" id="edit-date" required />
          </div>
          <button type="submit">Update Transaction</button>
        </form>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
